<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>
<body>
    <h1> tao hoc luc yeu</h1>
    <script> 
        var x,y, diem, xeploai;
        x=6;
        y=3;
        diem = (x+y)/2;
        document.write("ket qua cua viec hoc nguu: ");
        document.write(diem);
        if(diem>=8.5){
            xeploai="Gioi";
        }
        else if(diem>=7){
            xeploai="kha";
        }
        else if(diem>=5){
            xeploai="TB";
        }
        else{
            xeploai="yeu";
        }
        document.write(xeploai);
    </script>
</body>
